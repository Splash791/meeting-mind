<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1f35 100%);
      color: #e5e7eb;
    }

    .container {
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .status {
      font-size: 12px;
      padding: 4px 8px;
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      border-radius: 4px;
      display: inline-block;
    }

    .status.inactive {
      background: rgba(107, 114, 128, 0.2);
      color: #d1d5db;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .metric-label {
      color: #d1d5db;
    }

    .metric-value {
      font-weight: 600;
      color: #fff;
      font-size: 16px;
    }

    .score-high {
      color: #22c55e;
    }

    .score-medium {
      color: #f59e0b;
    }

    .score-low {
      color: #ef4444;
    }

    .button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    .button:hover {
      opacity: 0.9;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
    }

    .notes-area {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 8px;
      margin-top: 8px;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
      padding: 8px;
      border-radius: 4px;
      font-family: inherit;
      resize: none;
    }

    textarea::placeholder {
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #4b5563;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span style="font-size: 20px;">🎯</span>
      <div>
        <h1>MeetingMind</h1>
        <span id="status" class="status inactive">Not in meeting</span>
      </div>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 8px; font-size: 12px;">Checking for active meeting...</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
